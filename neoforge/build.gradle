plugins {
    id 'com.gradleup.shadow'
    id 'net.darkhax.curseforgegradle'
    id "com.modrinth.minotaur"
}

loom {
    forge {
        mixinConfig "pocketgps.mixins.json"
    }

    runs {
        client {
            client()
            setConfigName("Forge Client")
            ideConfigGenerated(true)
            runDir("run-client")
        }
        server {
            server()
            setConfigName("Forge Server")
            ideConfigGenerated(true)
            runDir("run-server")
        }
    }
}

architectury {
    platformSetupLoomIde()
    neoForge()
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentNeoForge.extendsFrom common

    // Files in this configuration will be bundled into your mod using the Shadow plugin.
    // Don't use the `shadow` configuration from the plugin itself as it's meant for excluding files.
    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }

    configureEach {
        resolutionStrategy.force("net.sf.jopt-simple:jopt-simple:5.0.4")
    }
}

dependencies {
    neoForge "net.neoforged:neoforge:${project.neoforge_version}"

    common(project(path: ':common', configuration: 'namedElements')) { transitive false }
    shadowBundle project(path: ':common', configuration: 'transformProductionNeoForge')

    modLocalRuntime "maven.modrinth:mekanism:${project.mekanism_version}"
    modLocalRuntime "maven.modrinth:mekanism-generators:${project.mekanism_version}"

    //Xaero's Minimap
    modCompileOnly "maven.modrinth:xaeros-minimap:${project.xaeros_minimap_version}_NeoForge_1.21"
    modCompileOnly "maven.modrinth:xaeros-world-map:${project.xaeros_worldmap_version}_NeoForge_1.21"

    //JourneyMap
    modCompileOnlyApi group: 'info.journeymap', name: 'journeymap-api-neoforge', version: project.journeymap_api_version, changing: true
    modCompileOnly "maven.modrinth:journeymap:1.21.1-${project.journeymap_version}+neoforge"

    //FTB Chunks + Dependencies
    modCompileOnly "curse.maven:ftb-chunks-forge-314906:${project.ftb_chunks_neoforge_version}"
    modCompileOnly "curse.maven:ftb-library-forge-404465:${project.ftb_library_neoforge_version}"
    modCompileOnly "curse.maven:ftb-teams-forge-404468:${project.ftb_teams_neoforge_version}"
    modCompileOnly "maven.modrinth:architectury-api:${project.architectury_version}+neoforge"

    //Curios + Accessories
    modCompileOnly "io.wispforest:accessories-neoforge:${project.accessories_version}"
    modCompileOnly("me.shedaniel.cloth:cloth-config-forge:${project.cloth_config_version}") {
        exclude group: 'net.fabricmc', module: 'fabric-loader'
    }
    modCompileOnly "maven.modrinth:accessories-cc-layer:${project.curios_version}"
    modCompileOnly("me.shedaniel.cloth:cloth-config-neoforge:${project.cloth_config_version}") {
        exclude(group: "net.fabricmc.fabric-api")
    }
    // Development QOL
    modLocalRuntime("mezz.jei:jei-${minecraft_version}-neoforge:${jei_version}") { transitive = false }

    // Minimap Mod Dev Tests
    // See root gradle.properties to choose which to use at runtime.
    switch (project.minimap_mod.toLowerCase(Locale.ROOT)) {
        case "xaero":
            modLocalRuntime "maven.modrinth:xaeros-minimap:${project.xaeros_minimap_version}_NeoForge_1.21"
            break
        case "journey":
            modImplementation group: 'info.journeymap', name: 'journeymap-api-neoforge', version: project.journeymap_api_version, changing: true
            modImplementation "maven.modrinth:journeymap:1.21.1-${project.journeymap_version}+neoforge"
            modImplementation("maven.modrinth:common-network:${project.common_network_version}-neoforge")
            break
        case "ftb":
            modLocalRuntime "curse.maven:ftb-chunks-forge-314906:${project.ftb_chunks_neoforge_version}"
            modLocalRuntime "curse.maven:ftb-library-forge-404465:${project.ftb_library_neoforge_version}"
            modLocalRuntime "curse.maven:ftb-teams-forge-404468:${project.ftb_teams_neoforge_version}"
            modLocalRuntime "maven.modrinth:architectury-api:${project.architectury_version}+neoforge"
            break
        case "atlas":
            break
        case "none":
            break
        default: println("Unknown recipe viewer specified: ${project.minimap_mod}. Must be xaero, journey, ftb, " +
                "atlas, or none")
    }
}


shadowJar {
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = 'dev-shadow'
}

remapJar {
    inputFile.set shadowJar.archiveFile
}

modrinth {
    debugMode = false
    token = System.getenv("MODRINTH_TOKEN")
    projectId = modrinth_project_id
    versionNumber = minecraft_version + "-" + version
    versionName = base.archivesName.get() + "-" + mod_version
    versionType = "release"
    uploadFile = remapJar

    List<String> mcVersions = minecraft_game_versions.split(",")
    gameVersions = mcVersions
    loaders = ["neoforge"]

    changelog = projectDir.toPath().getParent().resolve("LATEST_CHANGELOG.md").getText()

    dependencies {
        optional.project "xaeros-minimap"
        optional.project "xaeros-minimap-fair"
        optional.project "journeymap"
        optional.project "curios"
        optional.project "accessories"
    }
}

tasks.register('publishCurseForge', net.darkhax.curseforgegradle.TaskPublishCurseForge) {
    group = "curseforge"

    debugMode = false
    disableVersionDetection()
    apiToken = System.getenv("CURSEFORGE_TOKEN")

    def mainFile = upload(curseforge_project_id, remapJar)
    mainFile.changelogType = "markdown"
    mainFile.changelog = projectDir.toPath().getParent().resolve("LATEST_CHANGELOG.md").getText()
    mainFile.releaseType = "release"

    List<String> mcVersions = minecraft_game_versions.split(",")
    mainFile.gameVersions = mcVersions
    mainFile.addModLoader("NeoForge")
    mainFile.addJavaVersion("Java 21")

    mainFile.addOptional("xaeros-minimap")
    mainFile.addOptional("xaeros-minimap-fair-play-edition")
    mainFile.addOptional("journeymap")
    mainFile.addOptional("ftb-chunks-forge")
    mainFile.addOptional("curios")
    mainFile.addOptional("accessories")
}

tasks.register('publishNeoForge') {
    group = "upload"
    dependsOn(tasks.publishCurseForge)
    dependsOn(tasks.modrinth)
}